name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS, because the extension only runs there and `ray build` is a macOS tool.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: extensions/raycast-simple2fa
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/raycast-simple2fa/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
